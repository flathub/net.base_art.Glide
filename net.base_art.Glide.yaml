app-id: net.base_art.Glide
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
cleanup:
  - /include
command: glide
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=wayland
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/glide/cargo
modules:
  - name: libass
    config-opts:
      - --enable-shared
      - --disable-static
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
      - type: script
        commands:
          - autoreconf -fiv
        dest-filename: autogen.sh

  - name: glide
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/philn/glide/releases/download/0.6.9/glide-0.6.9.tar.xz
        sha256: fd5a590ea96deab39bfd4aee364fe6fbadeb920d27a7040c817fcf563b184d98
        x-checker-data:
          type: json
          url: https://api.github.com/repos/philn/glide/releases/latest
          version-query: .tag_name | sub("^glide-"; "")
          url-query: .assets[] | select(.name=="glide-" + $version + ".tar.xz") |
            .browser_download_url
